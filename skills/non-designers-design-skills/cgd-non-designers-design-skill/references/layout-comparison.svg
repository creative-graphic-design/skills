<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Layout comparison for a repair cafe</title>
  <desc id="desc">The same repair workshop copy appears in a scattered before panel and a grouped after panel.</desc>
  <rect width="1600" height="1000" fill="#F4F1EA"/>

  <text x="70" y="76" fill="#18344A" font-family="Arial" font-size="26" font-weight="700" letter-spacing="2">LAYOUT COMPARISON</text>
  <text x="70" y="116" fill="#60727A" font-family="Arial" font-size="20">One workshop. Two ways to make the next step visible.</text>

  <rect x="60" y="170" width="720" height="760" rx="24" fill="#FFFDF8" stroke="#D7D1C5" stroke-width="2"/>
  <rect x="820" y="170" width="720" height="760" rx="24" fill="#FFFDF8" stroke="#D7D1C5" stroke-width="2"/>

  <text x="100" y="222" fill="#60727A" font-family="Arial" font-size="17" font-weight="700" letter-spacing="3">BEFORE</text>
  <circle cx="696" cy="214" r="12" fill="#E7A83E"/>
  <text x="860" y="222" fill="#60727A" font-family="Arial" font-size="17" font-weight="700" letter-spacing="3">AFTER</text>
  <circle cx="1456" cy="214" r="12" fill="#2D827C"/>

  <g aria-label="Scattered workshop layout">
    <rect x="100" y="266" width="156" height="12" fill="#E7A83E"/>
    <text x="100" y="338" fill="#18344A" font-family="Arial" font-size="38" font-weight="700">REPAIR CAFÉ</text>
    <text x="472" y="292" fill="#2D827C" font-family="Arial" font-size="18" font-weight="700">FREE ENTRY</text>
    <text x="102" y="388" fill="#60727A" font-family="Arial" font-size="23">Bring a lamp, a kettle,</text>
    <text x="102" y="418" fill="#60727A" font-family="Arial" font-size="23">or a small chair</text>

    <rect x="412" y="370" width="250" height="90" rx="8" fill="#E7A83E"/>
    <text x="432" y="426" fill="#18344A" font-family="Arial" font-size="22" font-weight="700">Saturday 12 October</text>

    <circle cx="150" cy="518" r="42" fill="#2D827C"/>
    <rect x="215" y="488" width="224" height="64" fill="#F2D8A5"/>
    <text x="235" y="528" fill="#18344A" font-family="Arial" font-size="25">10:00–13:00</text>

    <text x="494" y="538" fill="#18344A" font-family="Arial" font-size="18" font-weight="700">NORTH LOOP WORKSHOP</text>
    <line x1="100" y1="602" x2="658" y2="602" stroke="#D7D1C5" stroke-width="3"/>

    <text x="120" y="665" fill="#E7A83E" font-family="Arial" font-size="52" font-weight="700">FREE ENTRY</text>
    <text x="472" y="638" fill="#60727A" font-family="Arial" font-size="16" font-weight="700">BOOK A BENCH</text>
    <text x="366" y="700" fill="#18344A" font-family="Arial" font-size="21">repair@example.org</text>
    <text x="520" y="890" fill="#60727A" font-family="Arial" font-size="14">loose edges, mixed signals</text>
  </g>

  <g aria-label="Grouped workshop layout">
    <rect x="860" y="266" width="156" height="12" fill="#2D827C"/>
    <text x="860" y="352" fill="#18344A" font-family="Arial" font-size="82" font-weight="700">REPAIR CAFÉ</text>
    <text x="860" y="396" fill="#60727A" font-family="Arial" font-size="25">Bring a lamp, a kettle, or a small chair</text>
    <line x1="860" y1="434" x2="1500" y2="434" stroke="#18344A" stroke-width="3"/>

    <rect x="860" y="478" width="298" height="280" rx="14" fill="#EEF3EF"/>
    <rect x="1182" y="478" width="318" height="280" rx="14" fill="#F8E7BC"/>
    <text x="894" y="528" fill="#2D827C" font-family="Arial" font-size="16" font-weight="700" letter-spacing="2">WHEN + WHERE</text>
    <text x="894" y="590" fill="#18344A" font-family="Arial" font-size="24" font-weight="700">Saturday 12 October</text>
    <text x="894" y="632" fill="#18344A" font-family="Arial" font-size="24">10:00–13:00</text>
    <text x="894" y="702" fill="#18344A" font-family="Arial" font-size="21" font-weight="700">North Loop Workshop</text>

    <text x="1218" y="528" fill="#2D827C" font-family="Arial" font-size="16" font-weight="700" letter-spacing="2">YOUR NEXT STEP</text>
    <text x="1218" y="590" fill="#18344A" font-family="Arial" font-size="26" font-weight="700">Free entry</text>
    <text x="1218" y="642" fill="#18344A" font-family="Arial" font-size="22">Book a bench</text>
    <text x="1218" y="702" fill="#18344A" font-family="Arial" font-size="19">repair@example.org</text>

    <rect x="860" y="794" width="640" height="16" rx="8" fill="#18344A"/>
    <text x="860" y="900" fill="#60727A" font-family="Arial" font-size="14">purpose first · shared edges · repeated roles</text>
  </g>
</svg>
